name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm run build
      # Real-browser checks (both languages, 390 px and desktop, links, a11y basics, theme toggle).
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.49.1
      - run: npx playwright-core install --with-deps chromium
      - run: |
          python3 -m http.server 5201 --bind 127.0.0.1 --directory dist &
          sleep 1
          node tests/browser.mjs http://127.0.0.1:5201
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only after validation passes, and only from main (a merged, reviewed PR).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
